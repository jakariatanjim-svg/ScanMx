name: Build & Release ScanMx

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create release folder
        run: |
          mkdir -p single-file
          cp single-file/index.html single-file/ScanMx.html
          
      - name: Get release tag
        id: tag
        run: |
          TAG="v${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
      - name: Create Release using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release
          gh release create ${{ steps.tag.outputs.tag }} \
            --title "ScanMx ${{ steps.tag.outputs.tag }}" \
            --notes-file - << 'EOF'
# ScanMx - Personal Document Scanner

A fully browser-based document scanner with OCR capabilities.

## How to Use
1. Download the HTML file below
2. Open in any browser
3. Start scanning!

## Features
- 📷 Camera capture
- 🖼️ Image editing
- 🔤 OCR (Bangla + English)
- 🌙 Dark mode
EOF
          
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.tag.outputs.tag }} single-file/ScanMx.html --clobber